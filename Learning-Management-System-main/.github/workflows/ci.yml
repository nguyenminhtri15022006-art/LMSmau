name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Compile all modules
        run: mvn -B clean compile -q
        working-directory: ./backend

      - name: Compile test sources (skip infrastructure-dependent execution)
        run: mvn -B clean test-compile -q
        working-directory: ./backend

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint
        run: npm run lint
        working-directory: ./frontend

      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_API_TIMEOUT_MS: 15000
          VITE_GOOGLE_CLIENT_ID: ci-dummy
          VITE_GOOGLE_REDIRECT_URI: http://localhost:5173/authenticate
          VITE_GOOGLE_AUTH_URI: https://accounts.google.com/o/oauth2/v2/auth
          VITE_PUBLIC_IP_API_URL: https://api.ipify.org?format=json
          VITE_PUBLIC_IP_TIMEOUT_MS: 3000
          VITE_GATEWAY_HEALTH_URL: http://localhost:8080/actuator/health/liveness
          VITE_IDENTITY_HEALTH_URL: http://localhost:8081/identity/actuator/health
          VITE_COURSE_HEALTH_URL: http://localhost:8082/course/actuator/health/liveness
          VITE_ASSIGNMENT_HEALTH_URL: http://localhost:8083/assignment/actuator/health/liveness
          VITE_BLOG_HEALTH_URL: http://localhost:8084/blog/actuator/health/liveness
          VITE_CHATBOT_HEALTH_URL: http://localhost:8085/chatbot/actuator/health/liveness
          VITE_ADMIN_HEALTH_TIMEOUT_MS: 5000
          VITE_ADMIN_HEALTH_IDENTITY_TIMEOUT_MS: 12000
          VITE_ADMIN_HEALTH_REFRESH_INTERVAL_MS: 30000

  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - service-registry
          - api-gateway
          - identity-service
          - course-service
          - assignment-service
          - blog-service
          - chatbot-service
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.service }}
          push: false
          tags: ci-test/${{ matrix.service }}:latest
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}
